<div class="mainSection">
  <nav class="navBar">MultiGenesys Chat-bot🤖</nav>

  <div class="innerDivForBot" #scrollMe>
    <div class="chatSection">
      <div id="chatSectionFotTS" *ngFor="let msg of messages$ | async">
        <div class="userSide" *ngIf="msg.sender === 'user'">
          {{ msg.text }}
        </div>

        <div class="aiSide" *ngIf="msg.sender === 'ai'">
          {{ msg.text }}
        </div>
      </div>

      <div *ngIf="isLoading$ | async" class="aiSideForLoading">
        <div class="aiSide">
          <div class="loader"></div>
        </div>
      </div>

      <div *ngIf="error$ | async as errorMsg" class="errorAlert">
        {{ errorMsg }}
      </div>
    </div>
  </div>

  <div class="inputAndBtn">
    <div class="inputArea">
      <input
        type="text"
        id="inputForUser"
        [(ngModel)]="userInputForGo"
        (keyup.enter)="submitUserMsg()"
        placeholder="Enter text!"
      />
    </div>

    <button
      type="button"
      (click)="submitUserMsg()"
      [disabled]="isLoading$ | async"
    >
      <svg
        class="svg_Image"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 448 512"
      >
        <path
          d="M246.6 9.4c-12.5-12.5-32.8-12.5-45.3 0l-128 128c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 109.3 192 320c0 17.7 14.3 32 32 32s32-14.3 32-32l0-210.7 73.4 73.4c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3l-128-128zM64 352c0-17.7-14.3-32-32-32S0 334.3 0 352l0 64c0 53 43 96 96 96l256 0c53 0 96-43 96-96l0-64c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 64c0 17.7-14.3 32-32 32L96 448c-17.7 0-32-14.3-32-32l0-64z"
        />
      </svg>

      
    </button>
  </div>
</div>
